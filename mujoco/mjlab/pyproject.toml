[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minidog-mjlab"
version = "0.1.0"
description = "Residual reinforcement-learning scaffold for HTDW-4438 MiniDog in MuJoCo/MJLab."
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.2",
  "numpy>=1.24",
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "pyyaml>=6.0",
  "tensorboard>=2.14",
  "matplotlib>=3.8",
  "torch>=2.4",
]

[project.optional-dependencies]
cu128 = ["torch>=2.4"]
native = ["mjlab[cu128]>=1.0.0"]

[project.entry-points."mjlab.tasks"]
minidog_native = "minidog_native"

[tool.setuptools.packages.find]
where = ["."]
include = ["minidog_rl*", "legged_gym*", "minidog_native*"]

[tool.uv]
cache-dir = "D:\\uv"
override-dependencies = ["mujoco>=3.8.0.dev0"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
mujoco = { index = "mujoco" }
